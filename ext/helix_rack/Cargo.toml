[package]
name = "helix_rack"
version = "0.1.0"
edition = "2021"
authors = ["Romeu Fonseca <romeu.hcf@gmail.com>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# Forwards to `helixrack-engine`'s own feature of the same name (off by
# default) -- enable with `RB_SYS_CARGO_FEATURES=combine-write` at build time
# (see `rb_sys/mkmf.rb`'s `RB_SYS_CARGO_FEATURES` override) to build the
# opt-in head+body single-write path instead of the default two-write one.
[features]
combine-write = ["helixrack-engine/combine-write"]

[dependencies]
magnus = { version = "0.8.2" }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }
helixrack-engine = { path = "../../engine" }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }
tempfile = "3"
# `local_dynamic_tls` forwards straight through to `libmimalloc-sys`'s own
# feature of the same name (`mimalloc`'s own `[features]` table:
# `local_dynamic_tls = ["libmimalloc-sys/local_dynamic_tls"]` -- confirmed
# against the vendored 0.1.52 Cargo.toml directly, not assumed). See
# `GLOBAL_ALLOCATOR`'s doc comment in src/lib.rs for the safety-review
# finding this fixes: without it, mimalloc's C code compiles with
# `-ftls-model=initial-exec`, which shares a small, process-wide static-TLS
# budget with every other `dlopen`'d library -- verified to be able to make
# a later `require` in the same process fail outright with "cannot allocate
# memory in static TLS block", not just degrade.
mimalloc = { version = "0.1.52", features = ["local_dynamic_tls"] }

[build-dependencies]
rb-sys-env = "0.2.2"

[dev-dependencies]
rb-sys-test-helpers = { version = "0.2.2" }
