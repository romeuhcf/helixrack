# Phase 12 (PLAN.md, Phase 12): kept in sync with helix_rack.gemspec's
# required_ruby_version -- that file's own comment explains why it's 3.3,
# not 3.2 (rubocop's own Gemspec/RequiredRubyVersion cop flags a mismatch
# between the two, which is how this got caught).
AllCops:
  TargetRubyVersion: 3.3

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Phase 13 (PLAN.md, Phase 13): `bench/run.rb` is a standalone orchestration
# script (build an image, boot containers, drive k6, compute a gate), not
# library code under `lib/`/`ext/` -- it genuinely reads better as a handful
# of longer, sequential, single-purpose methods matching its own procedural
# nature than fragmented to satisfy a line-count/complexity budget meant for
# reusable API code. Scoped to `bench/**/*` only; `lib/`/`ext/`/`engine/`
# keep the default budgets.
Metrics:
  Exclude:
    - "bench/**/*"

Style/Documentation:
  Exclude:
    - "bench/**/*"
