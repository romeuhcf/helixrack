name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.6'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
          rubygems: '4.0.16'
      - name: Run the default task
        run: bundle exec rake
      - name: Run engine/ gate tests
        run: cargo test --manifest-path engine/Cargo.toml
      - name: Clippy (engine/)
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - name: Clippy (ext/helix_rack/)
        run: cargo clippy --manifest-path ext/helix_rack/Cargo.toml --all-targets -- -D warnings
