---
name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Run the Phase 13 benchmark harness
        run: bundle exec rake bench

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: bench/results/
